services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: runner
    container_name: cheers_backend
    ports:
      - "3001:3001"
    volumes:
      - cheers_db_data:/app/data
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/database.sqlite
      - JWT_SECRET=${JWT_SECRET}
      - RP_ID=${RP_ID}
      - HOTPEPPER_API_KEY=${HOTPEPPER_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: build
    container_name: cheers_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://backend:3001/api
    depends_on:
      - backend
    restart: unless-stopped

  redmine_db:
    image: postgres:16-alpine
    container_name: redmine_db
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: ${REDMINE_DB_PASSWORD}
    volumes:
      - redmine_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redmine:
    image: redmine:6
    container_name: redmine_app
    ports:
      - "8080:3000"
    environment:
      REDMINE_DB_POSTGRES: redmine_db
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: ${REDMINE_DB_PASSWORD}
      REDMINE_SECRET_KEY_BASE: ${REDMINE_SECRET_KEY_BASE}
    volumes:
      - redmine_files:/usr/src/redmine/files
    depends_on:
      - redmine_db
    restart: unless-stopped

volumes:
  cheers_db_data:
  redmine_db_data:
  redmine_files:
