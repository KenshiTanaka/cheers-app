services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cheers_backend
    ports:
      - "3001:3001"
    volumes:
      - cheers_db_data:/app/data
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/database.sqlite
      - JWT_SECRET=cheers_secret_key_2026_prod
      - RP_ID=monitoring-aaa-initial-layout.trycloudflare.com
      - HOTPEPPER_API_KEY=5c026a6238e0e4b8
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cheers_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://backend:3001/api
    depends_on:
      - backend
    restart: unless-stopped

  # ===== Redmine（タスク管理ツール） =====
  redmine_db:
    image: postgres:16-alpine
    container_name: redmine_db
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: redmine_secure_2026
    volumes:
      - redmine_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redmine:
    image: redmine:6
    container_name: redmine_app
    ports:
      - "8080:3000"
    environment:
      REDMINE_DB_POSTGRES: redmine_db
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: redmine_secure_2026
      REDMINE_SECRET_KEY_BASE: cheers_redmine_secret_key_2026
    volumes:
      - redmine_files:/usr/src/redmine/files
    depends_on:
      - redmine_db
    restart: unless-stopped

volumes:
  cheers_db_data:
  redmine_db_data:
  redmine_files:
