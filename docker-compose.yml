services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cheers_backend
    ports:
      - "3001:3001"
    volumes:
      - cheers_db_data:/app/data
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/database.sqlite
      - JWT_SECRET=cheers_secret_key_2026_prod
      - RP_ID=monitoring-aaa-initial-layout.trycloudflare.com
      - HOTPEPPER_API_KEY=5c026a6238e0e4b8
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cheers_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://backend:3001/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cheers_db_data:
